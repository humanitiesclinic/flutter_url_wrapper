      - name: Get dependencies
        script: flutter pub get
      - name: Build Linux
        script: flutter build linux --release
    artifacts:
      - build/linux/x64/release/bundle/*
    publishing:
      email:
        recipients:
          - $CODEMAGIC_EMAIL
        notify:
          success: true
          failure: true
