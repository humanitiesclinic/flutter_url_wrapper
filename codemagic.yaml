workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_id: com.example.flutter_url_wrapper
      vars:
        FLUTTER_VERSION: "3.24.0"
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
    scripts:
      - name: Set up Flutter
        script: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          export PATH="$PATH:$HOME/flutter/bin"
          flutter config --no-analytics
          flutter pub get
      - name: Build iOS
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      app_store_connect:
        auth: integration
        bundle_id: com.example.flutter_url_wrapper

  android-workflow:
    name: Android Build
    instance_type: linux_x2
    environment:
      android_signing:
        - keystore_reference
      vars:
        FLUTTER_VERSION: "3.24.0"
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
    scripts:
      - name: Set up Flutter
        script: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          export PATH="$PATH:$HOME/flutter/bin"
          flutter config --no-analytics
          flutter pub get
      - name: Build Android
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter build apk --release
      - name: Build App Bundle
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      google_play:
        credentials: $GPLAY_CREDENTIALS
        track: internal

  macos-workflow:
    name: macOS Build
    instance_type: mac_mini_m1
    environment:
      vars:
        FLUTTER_VERSION: "3.24.0"
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
    scripts:
      - name: Set up Flutter
        script: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          export PATH="$PATH:$HOME/flutter/bin"
          flutter config --no-analytics
          flutter pub get
      - name: Build macOS
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter build macos --release
    artifacts:
      - build/macos/Build/Products/Release/*.app

  windows-workflow:
    name: Windows Build
    instance_type: windows_x2
    environment:
      vars:
        FLUTTER_VERSION: "3.24.0"
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
    scripts:
      - name: Set up Flutter
        script: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable %USERPROFILE%\flutter
          set PATH=%PATH%;%USERPROFILE%\flutter\bin
          flutter config --no-analytics
          flutter pub get
      - name: Build Windows
        script: |
          set PATH=%PATH%;%USERPROFILE%\flutter\bin
          flutter build windows --release
    artifacts:
      - build/windows/runner/Release/

  linux-workflow:
    name: Linux Build
    instance_type: linux_x2
    environment:
      vars:
        FLUTTER_VERSION: "3.24.0"
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
    scripts:
      - name: Set up Flutter
        script: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          export PATH="$PATH:$HOME/flutter/bin"
          flutter config --no-analytics
          flutter pub get
      - name: Build Linux
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter build linux --release
    artifacts:
      - build/linux/x64/release/bundle/
