workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.10
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.humanitiesclinic.everythinginperspective"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release
    artifacts:
      - build/ios/iphoneos/*.app

  android-build:
    name: Android Build
    instance_type: linux_x2
    environment:
      flutter: 3.38.10
      java: 17
      ndk: default
      vars:
        BUNDLE_ID: "com.humanitiesclinic.everythinginperspective"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build Android AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  macos-build:
    name: macOS Build
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.10
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.flutter_url_wrapper"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build macOS
        script: flutter build macos --release
    artifacts:
      - build/macos/Build/Products/Release/*.app

