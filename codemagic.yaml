workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.10
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.flutter_url_wrapper"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - $CODEMAGIC_EMAIL
        notify:
          success: true
          failure: true

  android-build:
    name: Android Build
    instance_type: linux_x2
    environment:
      flutter: 3.38.10
      java: 11
      ndk: default
      vars:
        BUNDLE_ID: "com.example.flutter_url_wrapper"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - $CODEMAGIC_EMAIL
        notify:
          success: true
          failure: true

  macos-build:
    name: macOS Build
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.10
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.flutter_url_wrapper"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build macOS
        script: flutter build macos --release
    artifacts:
      - build/macos/Build/Products/Release/*.app
    publishing:
      email:
        recipients:
          - $CODEMAGIC_EMAIL
        notify:
          success: true
          failure: true

  windows-build:
    name: Windows Build
    instance_type: windows_x2
    environment:
      flutter: 3.38.10
      vars:
        BUNDLE_ID: "com.example.flutter_url_wrapper"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build Windows
        script: flutter build windows --release
    artifacts:
      - build/windows/runner/Release/*.exe
    publishing:
      email:
        recipients:
          - $CODEMAGIC_EMAIL
        notify:
          success: true
          failure: true

  linux-build:
    name: Linux Build
    instance_type: linux_x2
    environment:
      flutter: 3.38.10
      vars:
        BUNDLE_ID: "com.example.flutter_url_wrapper"
    triggering:
      events:
